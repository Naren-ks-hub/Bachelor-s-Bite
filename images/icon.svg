<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.4"/>
  
  <!-- Chef Hat / Monogram Group -->
  <g transform="translate(106, 80)">
    <!-- Chef Hat Base -->
    <path d="M 60 180 L 240 180 C 250 180, 255 190, 250 200 L 235 250 C 230 260, 220 265, 210 265 L 90 265 C 80 265, 70 260, 65 250 L 50 200 C 45 190, 50 180, 60 180 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Hat Puffs -->
    <circle cx="90" cy="120" r="55" fill="#ffffff"/>
    <circle cx="150" cy="85" r="65" fill="#ffffff"/>
    <circle cx="210" cy="120" r="55" fill="#ffffff"/>

    <!-- Pan Sparkle & Food Motif -->
    <ellipse cx="150" cy="225" rx="60" ry="12" fill="url(#pan)"/>
    <path d="M 135 225 Q 150 200 165 225" fill="none" stroke="#064e3b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Stylized "BB" Lettering -->
    <text x="150" y="320" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="44" fill="#34d399" text-anchor="middle" letter-spacing="2">BACHELOR</text>
    <text x="150" y="360" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="6">BITE</text>
  </g>
</svg>
